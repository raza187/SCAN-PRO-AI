workflows:
  android-debug:
    name: SCAN PRO AI Android Build
    max_build_duration: 60
    instance_type: linux_x2

    scripts:
      - name: Set Android SDK
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Build APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug

    artifacts:
      - app/build/outputs/**/*.apk
